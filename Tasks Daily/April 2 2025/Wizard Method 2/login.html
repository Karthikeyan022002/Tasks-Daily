<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <form action="dashboard.html">
            <p>
                User ID:
                <input
                    type="text"
                    name="user_id"
                    id="user_id"
                    placeholder="Enter Your User ID"
                    required
                />
            </p>
            <p>
                Password:
                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Enter Your Password"
                    required
                />
            </p>
            <p>
                <input type="submit" value="Login" />
            </p>
        </form>
    </body>
</html>
