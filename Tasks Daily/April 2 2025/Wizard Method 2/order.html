<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <form action="dashboard.html" method="post">
            <p>
                <img
                    src="https://th.bing.com/th/id/OIP.UNLkmp5w_v79mWBibXXDYwHaH_?w=240&h=259&c=8&rs=1&qlt=90&o=6&pid=3.1&rm=2"
                    alt="Order"
                    height="250"
                    width="250"
                />
                <br />
                ORDER
                <a href="dashboard.html">Back</a>
            </p>
            <p>
                Name:
                <input
                    type="text"
                    name="name"
                    id="name"
                    placeholder="Enter Your Name"
                />
            </p>
            <p>
                User ID:
                <input
                    type="text"
                    name="user_id"
                    id="user_id"
                    placeholder="Enter Your User ID"
                />
            </p>
            <p>
                Contact Number:
                <input
                    type="text"
                    name="contact_number"
                    placeholder="Enter Your Contact Number"
                />
            </p>
            <p>
                Address: <br />
                <textarea
                    name="address"
                    id="address"
                    rows="5"
                    cols="50"
                    placeholder="Enter Your Address"
                ></textarea>
            </p>
            <p><input type="submit" value="Submit" /></p>
        </form>
    </body>
</html>
