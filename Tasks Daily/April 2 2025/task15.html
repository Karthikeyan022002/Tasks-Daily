<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <form action="#" id="feedback_form">
            <table border="1" align="center">
                <tr align="center">
                    <td>FEEDBACK FORM</td>
                </tr>
                <tr>
                    <td>
                        <p>
                            Customer:
                            <select name="customer" id="customer">
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                            </select>
                        </p>
                        <p>
                            Product:
                            <select name="product" id="product">
                                <option value="X">X</option>
                                <option value="Y">Y</option>
                                <option value="Z">Z</option>
                            </select>
                        </p>
                        <p>
                            Rating:
                            <select name="rating" id="rating">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                            </select>
                        </p>
                        <p>
                            Remarks: <br />
                            <textarea
                                name="remarks"
                                id="remarks"
                                rows="5"
                                cols="50"
                                placeholder="Enter Your Remarks"
                            ></textarea>
                        </p>
                        <p>
                            <input
                                type="button"
                                value="Submit"
                                onclick="javascript:alert('Customer: ' + document.getElementById('customer').value + '\nProduct: ' + document.getElementById('product').value + '\nRating: ' + document.getElementById('rating').value + '\nRemarks: ' + document.getElementById('remarks').value)"
                            />
                        </p>
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
