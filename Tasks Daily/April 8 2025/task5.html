<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Salary</title>
        <link
            rel="stylesheet"
            href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
        />
        <style>
            body {
                padding-top: 70px;
            }
        </style>
    </head>
    <body>
        <form action="#">
            <div class="container border mb-5 p-2" style="text-align: center">
                <h3>Enter Basic Salary</h3>
                <br />
                <div class="form-group">
                    <input type="number" id="salary" name="salary" />
                    <button
                        type="button"
                        onclick="SalaryFunction();"
                        class="btn btn-primary"
                    >
                        Submit
                    </button>
                </div>
            </div>
            <div class="container border p-5">
                <div class="form-group">
                    <label for="hra">HRA:</label>
                    <input
                        type="number"
                        class="form-control"
                        id="hra"
                        name="hra"
                        disabled
                    />
                </div>
                <div class="form-group">
                    <label for="medical">MEDICAL:</label>
                    <input
                        type="number"
                        class="form-control"
                        id="medical"
                        name="medical"
                        disabled
                    />
                </div>
                <div class="form-group">
                    <label for="travel">TRAVEL:</label>
                    <input
                        type="number"
                        class="form-control"
                        id="travel"
                        name="travel"
                        disabled
                    />
                </div>
                <div class="form-group">
                    <label for="tds">TDS:</label>
                    <input
                        type="number"
                        class="form-control"
                        id="tds"
                        name="tds"
                        disabled
                    />
                </div>
                <div class="form-group">
                    <label for="total">TOTAL SALARY:</label>
                    <input
                        type="number"
                        class="form-control"
                        id="total"
                        name="total"
                        disabled
                    />
                </div>
            </div>
        </form>
        <script>
            function SalaryFunction() {
                var salary = parseInt(document.getElementById("salary").value);
                var hra = salary * 0.3;
                var medical = salary * 0.1;
                var travel = salary * 0.05;
                var tds = salary * 0.1;
                var total = salary + hra + medical + travel - tds;
                document.getElementById("hra").value = hra;
                document.getElementById("medical").value = medical;
                document.getElementById("travel").value = travel;
                document.getElementById("tds").value = tds;
                document.getElementById("total").value = total;
                alert("Salary Submitted Successfully!");
            }
        </script>
        <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    </body>
</html>
