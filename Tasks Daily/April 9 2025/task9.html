<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Class</title>
        <link
            rel="stylesheet"
            href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
        />
        <style>
            body {
                padding-top: 50px;
            }
        </style>
    </head>
    <body>
        <p id="output"></p>
        <script>
            //Parent Class
            class Bike {
                constructor(gears) {
                    this.gears = gears;
                }
            }

            //Child Class
            class Honda extends Bike {
                constructor(brand, gears) {
                    super(gears);
                    this.brand = brand;
                }
            }
            class Shine extends Honda {
                constructor(model, brand, gears) {
                    super(brand, gears);
                    this.model = model;
                }
            }

            const newBike = new Shine("Shine", "Honda", 5);
            document.getElementById(
                "output"
            ).innerHTML = `The ${newBike.model} model of the ${newBike.brand} brand has total ${newBike.gears} gears.`;

            // const abc = new Honda("Honda", 5);
            // document.getElementById(
            //     "output"
            // ).innerHTML = `The ${abc.brand} brand has total ${abc.gears} gears.`;
        </script>
        <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    </body>
</html>
