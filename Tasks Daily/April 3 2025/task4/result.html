<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <script>
            window.onload = function () {
                document.getElementById("name").textContent =
                    sessionStorage.getItem("name") || "N/A";
                document.getElementById("age").textContent =
                    sessionStorage.getItem("age") || "N/A";
                document.getElementById("dob").textContent =
                    sessionStorage.getItem("dob") || "N/A";
                document.getElementById("email").textContent =
                    sessionStorage.getItem("email") || "N/A";
                document.getElementById("qualification").textContent =
                    sessionStorage.getItem("qualification") || "N/A";
            };
        </script>
    </head>
    <body>
        <header>
            <fieldset>
                <div style="font-size: larger; text-align: center">
                    RESULT PAGE
                </div>
                </div>
            </fieldset>
        </header>
        <main>
            <section>
                <article>
                    <fieldset>
                        <div style="text-align: center">
                            <p>Name: <span id="name"></span></p>
                            <p>Age: <span id="age"></span></p>
                            <p>DOB: <span id="dob"></span></p>
                            <p>Email: <span id="email"></span></p>
                            <p>Qualification: <span id="qualification"></span></p>
                        </div>
                    </fieldset>
                </article>
            </section>
        </main>
    </body>
</html>
