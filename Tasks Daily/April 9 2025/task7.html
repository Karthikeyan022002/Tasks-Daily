<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Account</title>
        <link
            rel="stylesheet"
            href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
        />
        <style>
            body {
                padding-top: 50px;
            }
        </style>
    </head>
    <body>
        <form>
            <div
                class="container border mb-5 mt-3 p-3"
                style="text-align: center"
            >
                <h3 style="text-align: center">ACCOUNT DETAILS</h3>
                <div style="text-align: center">
                    <div class="form-group">
                        <button
                            type="button"
                            onclick="AddFunction();"
                            class="btn btn-primary"
                        >
                            LOAN
                        </button>
                        <button
                            type="button"
                            onclick="AddFunction();"
                            class="btn btn-primary"
                        >
                            DEPOSIT
                        </button>
                        <button
                            type="button"
                            onclick="MinusFunction();"
                            class="btn btn-primary"
                        >
                            WITHDRAW
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="bal">OPENING BALANCE:</label>
                    <input type="number" id="bal" name="bal" disabled />
                </div>
                <div class="form-group">
                    <label for="finalbal">BALANCE:</label>
                    <input
                        type="number"
                        id="finalbal"
                        name="finalbal"
                        disabled
                    />
                </div>
                <div class="form-group">
                    <label for="amount">AMOUNT:</label>
                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        placeholder="Enter Amount"
                    />
                </div>
            </div>

            <script>
                var bal = 10000;
                var finalbal = bal;

                document.getElementById("bal").value = bal;
                document.getElementById("finalbal").value = finalbal;

                function AddFunction() {
                    var amount =
                        parseInt(document.getElementById("amount").value) || 0;
                    finalbal = finalbal + amount;
                    document.getElementById("finalbal").value = finalbal;
                    document.getElementById("amount").value = "";
                }

                function MinusFunction() {
                    var amount =
                        parseInt(document.getElementById("amount").value) || 0;
                    finalbal = finalbal - amount;
                    document.getElementById("finalbal").value = finalbal;
                    document.getElementById("amount").value = "";
                }
            </script>
        </form>
        <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    </body>
</html>
