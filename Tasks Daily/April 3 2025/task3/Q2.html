<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <script>
            function storeData(event) {
                event.preventDefault();
                const choice = document.getElementsByName("options");
                let points = parseInt(localStorage.getItem("points")) || 0; // Initialize points as a number

                if (
                    !choice[0].checked &&
                    !choice[1].checked &&
                    !choice[2].checked &&
                    !choice[3].checked
                ) {
                    alert("Please select an option.");
                    return;
                }
                if (choice[0].checked) {
                    alert("Correct Answer!");
                    points++;
                } else {
                    alert("Wrong Answer!");
                    points--;
                }
                localStorage.setItem("points", points);
                window.location.href = "R.html";
            }

            window.onload = function () {
                const pointsInput = document.getElementById("points");
                pointsInput.value = localStorage.getItem("points") || 0;
            };
        </script>
    </head>
    <body>
        <form action="R.html" method="post" onsubmit="storeData(event)">
            <header>
                <fieldset>
                    <div style="font-size: larger; text-align: center">
                        HTML MCQ's
                    </div>
                </fieldset>
            </header>
            <main>
                <section>
                    <article>
                        <fieldset>
                            <div style="text-align: right">
                                <p>
                                    Points:
                                    <input type="number" id="points" readonly />
                                </p>
                            </div>
                            <div style="text-align: center">
                                <p>
                                    Question - 2: Which HTML attribute is used
                                    to define inline styles?
                                </p>
                                <p>
                                    Options:
                                    <input
                                        type="radio"
                                        name="options"
                                        id="option1"
                                    />
                                    'style' <br />
                                    <input
                                        type="radio"
                                        name="options"
                                        id="option2"
                                    />
                                    'class' <br />
                                    <input
                                        type="radio"
                                        name="options"
                                        id="option3"
                                    />
                                    'id' <br />
                                    <input
                                        type="radio"
                                        name="options"
                                        id="option4"
                                    />
                                    'font'
                                </p>
                                <p>
                                    <input type="submit" value="Submit" />
                                </p>
                            </div>
                        </fieldset>
                    </article>
                </section>
            </main>
        </form>
    </body>
</html>
