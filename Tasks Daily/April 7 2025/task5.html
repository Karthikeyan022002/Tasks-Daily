<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Company</title>
        <link
            rel="stylesheet"
            href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
        />
        <style>
            body {
                padding-top: 50px;
            }
            .navbar {
                margin: 20px;
            }
            .breadcrumb {
                margin: 20px;
            }
            .buttons {
                text-align: right;
            }
        </style>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
            <a class="navbar-brand" href="#">
                <i class="fa fa-graduation-cap"></i> Education Solutions
            </a>
            <button
                class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#navbarNav"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item active">
                        <a class="nav-link" href="#">HOME</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">ABOUT</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">CONTACT</a>
                    </li>
                </ul>
            </div>
        </nav>
        <nav aria-label="breadcrumb" class="navbar navbar-light bg-light">
            <ol class="breadcrumb">
                <li class="breadcrumb-item active">CUSTOMER</li>
                <li class="breadcrumb-item">PRODUCT</li>
                <li class="breadcrumb-item">ORDER</li>
            </ol>
            <div class="form-inline">
                <select
                    class="form-control mr-auto"
                    name="dropdown"
                    id="dropdown"
                >
                    <option value="" disabled selected>DROPDOWN</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
            </div>
            <div class="w-100">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">HOME</li>
                    <li class="breadcrumb-item">CUSTOMER</li>
                    <li class="breadcrumb-item active">ADD NEW</li>
                </ol>
            </div>
            <div class="w-100">
                <h3 style="text-align: center">ADD NEW</h3>
                <form action="#" method="post" class="container border">
                    <div class="form-group">
                        <label for="name">NAME: </label>
                        <input type="text" class="form-control" id="name" />
                    </div>
                    <div class="form-group">
                        <label for="age">AGE: </label>
                        <input type="number" class="form-control" id="age" />
                    </div>
                    <div class="form-group buttons">
                        <button type="submit" class="btn btn-primary">
                            SAVE
                        </button>
                    </div>
                </form>
            </div>
        </nav>

        <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    </body>
</html>
