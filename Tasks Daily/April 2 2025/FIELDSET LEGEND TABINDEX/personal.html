<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <form action="#">
            <fieldset>
                <legend>
                    <p>PERSONAL</p>
                </legend>
                <p>
                    NAME:
                    <input
                        type="text"
                        name="name"
                        id="name"
                        placeholder="Enter Your Name"
                        tabindex="1"
                    />
                </p>
                <p>
                    AGE:
                    <input
                        type="text"
                        name="age"
                        id="age"
                        placeholder="Enter Your Age"
                        tabindex="1"
                    />
                </p>
                <p>
                    SALARY:
                    <input
                        type="text"
                        name="salary"
                        id="salary"
                        placeholder="Enter Your Salary"
                        tabindex="1"
                    />
                </p>
            </fieldset>
            <p>
                <input type="submit" value="Submit" />
            </p>
        </form>
    </body>
</html>
